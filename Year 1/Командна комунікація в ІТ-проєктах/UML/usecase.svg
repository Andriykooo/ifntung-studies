<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" font-family="Arial, sans-serif" font-size="15">
  <!-- Діаграма варіантів використання: Кавовий автомат (ЛР-7, варіант 4) -->
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="960" height="550" fill="#fff"/>

  <!-- Межа системи -->
  <rect x="200" y="30" width="560" height="500" fill="#FAFBFD" stroke="#2F5597" stroke-width="2"/>
  <text x="480" y="58" text-anchor="middle" font-weight="bold" font-size="17">Кавовий автомат</text>

  <!-- Актор: Клієнт -->
  <g stroke="#333" stroke-width="2" fill="none">
    <circle cx="90" cy="250" r="14"/>
    <line x1="90" y1="264" x2="90" y2="305"/>
    <line x1="62" y1="279" x2="118" y2="279"/>
    <line x1="90" y1="305" x2="68" y2="340"/>
    <line x1="90" y1="305" x2="112" y2="340"/>
  </g>
  <text x="90" y="362" text-anchor="middle">Клієнт</text>

  <!-- Актор: Технік -->
  <g stroke="#333" stroke-width="2" fill="none">
    <circle cx="875" cy="415" r="14"/>
    <line x1="875" y1="429" x2="875" y2="470"/>
    <line x1="847" y1="444" x2="903" y2="444"/>
    <line x1="875" y1="470" x2="853" y2="505"/>
    <line x1="875" y1="470" x2="897" y2="505"/>
  </g>
  <text x="875" y="527" text-anchor="middle">Технік</text>

  <!-- Асоціації -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="120" y1="270" x2="258" y2="125"/>
    <line x1="120" y1="278" x2="256" y2="232"/>
    <line x1="120" y1="290" x2="257" y2="335"/>
    <line x1="120" y1="300" x2="260" y2="440"/>
    <line x1="845" y1="455" x2="727" y2="460"/>
  </g>

  <!-- Варіанти використання -->
  <g fill="#F4F6FA" stroke="#2F5597" stroke-width="2">
    <ellipse cx="360" cy="120" rx="105" ry="34"/>
    <ellipse cx="360" cy="230" rx="105" ry="34"/>
    <ellipse cx="360" cy="340" rx="105" ry="34"/>
    <ellipse cx="360" cy="450" rx="105" ry="34"/>
    <ellipse cx="640" cy="120" rx="100" ry="34"/>
    <ellipse cx="612" cy="460" rx="115" ry="34"/>
  </g>
  <g text-anchor="middle">
    <text x="360" y="125">Вибрати напій</text>
    <text x="360" y="235">Внести оплату</text>
    <text x="360" y="345">Видати напій</text>
    <text x="360" y="455">Видати решту</text>
    <text x="640" y="116">Повернути</text>
    <text x="640" y="134">кошти</text>
    <text x="612" y="456">Завантажити</text>
    <text x="612" y="474">інгредієнти</text>
  </g>

  <!-- include: Видати напій -> Внести оплату -->
  <line x1="360" y1="306" x2="360" y2="266" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#open)"/>
  <text x="370" y="291" font-size="14">«include»</text>

  <!-- extend: Повернути кошти -> Вибрати напій -->
  <line x1="540" y1="120" x2="467" y2="120" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#open)"/>
  <text x="503" y="110" text-anchor="middle" font-size="14">«extend»</text>

  <!-- Примітка з умовою розширення -->
  <path d="M520,190 L700,190 L712,202 L712,250 L520,250 Z" fill="#FFF2CC" stroke="#BF9000" stroke-width="1.2"/>
  <path d="M700,190 L700,202 L712,202" fill="none" stroke="#BF9000" stroke-width="1.2"/>
  <text x="530" y="212" font-size="13">Умова: обраний напій</text>
  <text x="530" y="229" font-size="13">не можна виготовити —</text>
  <text x="530" y="245" font-size="13">немає інгредієнтів</text>
  <line x1="505" y1="124" x2="560" y2="190" stroke="#BF9000" stroke-width="1.2" stroke-dasharray="3,3"/>
</svg>
